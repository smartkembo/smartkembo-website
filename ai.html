<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartKembo AI</title>
<meta name="description" content="Talk to SmartKembo AI about WiFi Vending, Water Vending and Shop & POS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#06101E; --card:#0C1A2E; --cyan:#00C8E8; --txt:#F2F8FF; --dim:#8BA3B8; --line:rgba(0,200,232,.14); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--navy);
    color: var(--txt);
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: #0B1B2E;
  }
  .mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: var(--cyan); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .name { font-size: 15px; font-weight: 600; }
  .status { font-size: 12px; color: var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#22C55E; animation: blink 1.4s infinite; }
  @keyframes blink {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); }
    70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  .web { margin-left: auto; color: var(--cyan); text-decoration: none; font-size: 13px; }
  #msgs {
    flex: 1 1 auto; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 86%; padding: 10px 12px; border-radius: 12px;
    font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .bot { background: #102033; align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--cyan); color: var(--navy); align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip {
    background:#0B1B2E; border:1px solid var(--line); color:#B7D4E4;
    border-radius:999px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #bar {
    flex: 0 0 auto;
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    background: #0B1B2E;
  }
  #input {
    flex: 1; min-width: 0; height: 44px;
    background: #102033; color: var(--txt);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: 16px/1.35 Inter, sans-serif; outline: none;
  }
  #send {
    width: 44px; height: 44px; border: 0; border-radius: 10px;
    background: var(--cyan); cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #send svg { width:18px; height:18px; fill: var(--navy); }
  #send:disabled { opacity:.4; }
</style>
</head>
<body>
<header>
  <div class="mark">SK</div>
  <div>
    <div class="name">SmartKembo AI</div>
    <div class="status"><span class="dot"></span> Online</div>
  </div>
  <a class="web" href="https://www.smartkembo.com">Website</a>
</header>
<div id="msgs"></div>
<div id="bar">
  <input id="input" maxlength="1000" placeholder="Write a message… / Andika ujumbe…">
  <button id="send" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>
<script>
(function () {
  var API = 'https://smartkembo-backend.onrender.com';
  var KEY = 'sk_ai_session';
  var msgs = document.getElementById('msgs');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var busy = false;

  function sid() {
    var id = localStorage.getItem(KEY);
    if (!id) {
      id = 'sk_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(KEY, id);
    }
    return id;
  }
  function add(text, who) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  add('👋 Hello. I am SmartKembo AI.\nHabari. Mimi ni SmartKembo AI.\n\nHow can I help you today?\nNaweza kukusaidiaje leo?\n\n📶 WiFi Vending\n💧 Water Vending\n🛒 Shop & POS\n💳 Pricing', 'bot');

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true; input.value = '';
    add(text, 'user');
    var wait = add('⏳ Thinking…', 'bot');
    try {
      var res = await fetch(API + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sid(), message: text })
      });
      var data = await res.json();
      wait.remove();
      add((data.success && data.data && data.data.reply) ? data.data.reply : 'Kuna hitilafu. / Something went wrong.', 'bot');
    } catch (e) {
      wait.remove();
      add('Cannot connect right now.\nWhatsApp: +255 767 830 319', 'bot');
    }
    busy = false; sendBtn.disabled = false; input.focus();
  }
  sendBtn.onclick = send;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });
})();
</script>
</body>
</html>
