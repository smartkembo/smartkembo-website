<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartKembo AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background: #212121;
    color: #ECECEC;
    display: flex;
  }
  aside {
    width: 260px; background: #171717;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
    border-right: 1px solid #2F2F2F;
  }
  .new {
    border: 1px solid #3D3D3D; background: transparent; color: #ECECEC;
    border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; text-align: left;
  }
  .brand { margin-top: auto; padding: 10px 8px; font-size: 13px; color: #B4B4B4; }
  .brand b { color: #fff; display:block; margin-bottom: 4px; }
  .brand a { color: #8B8B8B; text-decoration: none; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid #2F2F2F;
  }
  .online { font-size: 12px; color: #9B9B9B; display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#4ADE80; }
  #thread { flex: 1; overflow-y: auto; }
  .row {
    width: 100%;
    border-bottom: 1px solid #2A2A2A;
    padding: 22px 16px;
  }
  .row.bot { background: #2F2F2F; }
  .row.me { background: #212121; }
  .inner {
    max-width: 768px; margin: 0 auto;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .av {
    width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .av.bot { background: #00C8E8; color: #111; }
  .av.me { background: #5436DA; color: #fff; }
  .bubble { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.75; }
  .bubble p { margin: 0 0 12px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 0 0 12px 18px; padding: 0; }
  .bubble li { margin: 4px 0; }
  .hello { text-align: center; padding: 14vh 16px; }
  .hello h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px; }
  .hello p { color: #B4B4B4; margin: 0; }
  .composer { padding: 10px 16px 18px; background: #212121; }
  .box {
    max-width: 768px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: #303030; border: 1px solid #444;
    border-radius: 26px; padding: 8px 8px 8px 18px;
  }
  #input {
    flex: 1; min-height: 28px; max-height: 160px;
    background: transparent; border: 0; outline: none;
    color: #ECECEC; font: 16px/1.5 Inter, sans-serif;
    resize: none; padding: 8px 0;
  }
  #send {
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #send:disabled { opacity: .35; }
  #send svg { width: 16px; height: 16px; fill: #000; }
  .hint { max-width:768px; margin:8px auto 0; text-align:center; font-size:11px; color:#7A7A7A; }
  @media (max-width: 800px) { aside { display: none; } .hello h1 { font-size: 22px; } }
</style>
</head>
<body>
<aside>
  <button class="new" id="newChat">+ New chat</button>
  <div class="brand">
    <b>SmartKembo AI</b>
    <a href="https://www.smartkembo.com">www.smartkembo.com</a>
  </div>
</aside>
<main>
  <div class="topbar">
    <strong>SmartKembo AI</strong>
    <div class="online"><span class="dot"></span> Online</div>
  </div>
  <div id="thread">
    <div class="hello" id="hello">
      <h1>What can I help with?</h1>
      <p>Ask anything. For SmartKembo: WiFi, Water, Shop and pricing.</p>
    </div>
    <div id="msgs"></div>
  </div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Message SmartKembo AI"></textarea>
      <button id="send" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="hint">SmartKembo AI can make mistakes. Check important prices with +255 767 830 319.</div>
  </div>
</main>
<script>
(function () {
  var API = 'https://smartkembo-backend.onrender.com';
  var KEY = 'sk_ai_session';
  var msgs = document.getElementById('msgs');
  var hello = document.getElementById('hello');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var thread = document.getElementById('thread');
  var busy = false;

  function sid() {
    var id = localStorage.getItem(KEY);
    if (!id) {
      id = 'sk_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(KEY, id);
    }
    return id;
  }
  function fmt(text) {
    var s = String(text || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    var lines = s.split(/\n/);
    var html = '', list = false;
    lines.forEach(function (line) {
      var m = line.match(/^\s*[-*•]\s+(.+)/);
      if (m) {
        if (!list) { html += '<ul>'; list = true; }
        html += '<li>' + m[1] + '</li>';
      } else {
        if (list) { html += '</ul>'; list = false; }
        if (line.trim()) html += '<p>' + line + '</p>';
      }
    });
    if (list) html += '</ul>';
    return html || '<p></p>';
  }
  function add(text, who) {
    hello.style.display = 'none';
    var row = document.createElement('div');
    row.className = 'row ' + who;
    row.innerHTML = '<div class="inner"><div class="av ' + who + '">' + (who === 'bot' ? 'AI' : 'You') + '</div><div class="bubble"></div></div>';
    row.querySelector('.bubble').innerHTML = fmt(text);
    msgs.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return row.querySelector('.bubble');
  }

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true; input.value = ''; input.style.height = '28px';
    add(text, 'me');
    var wait = add('Thinking…', 'bot');
    try {
      var res = await fetch(API + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sid(), message: text })
      });
      var data = await res.json();
      wait.innerHTML = fmt((data.success && data.data && data.data.reply) ? data.data.reply : 'Something went wrong.');
    } catch (e) {
      wait.innerHTML = fmt('Cannot connect right now. WhatsApp: +255 767 830 319');
    }
    busy = false; sendBtn.disabled = false; input.focus();
    thread.scrollTop = thread.scrollHeight;
  }

  document.getElementById('newChat').onclick = function () {
    localStorage.removeItem(KEY);
    msgs.innerHTML = '';
    hello.style.display = '';
  };
  sendBtn.onclick = send;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', function () {
    input.style.height = '28px';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
})();
</script>
</body>
</html>
